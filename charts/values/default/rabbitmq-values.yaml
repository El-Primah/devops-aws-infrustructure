
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/rabbitmq
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "rabbitmq"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: amqp
    containerPort: 5672
    protocol: TCP
  - name: management
    containerPort: 15672
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  port: 5672
  ports:
    - name: tcp-5672
      port: 5672
      protocol: TCP
      targetPort: 5672
    - name: tcp-15672
      port: 15672
      protocol: TCP
      targetPort: 15672
    - name: tcp-80
      port: 80
      protocol: TCP
      targetPort: 15672

ingress:
  enabled: false

resources:
  requests:
    cpu: 30m
    memory: 117Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        key: environment
        name: env-config

priority: 0
