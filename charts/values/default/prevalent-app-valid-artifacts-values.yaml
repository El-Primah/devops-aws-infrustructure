deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/group1
  pullPolicy: Always
  tag: latest

nameOverride: ""
fullnameOverride: "prevalent-app-valid-artifacts"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  type: NodePort
  annotations: {}
  port: 80 # Для совместимости с ingress, если понадобится
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 30977

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    cpu: 200m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: command
    value: "prod"
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        name: env-config
        key: environment

volumeMounts:
  - name: logs
    mountPath: /var/logs/supervisor/

volumes:
  - name: logs
    hostPath:
      path: /LOGS/prevalent-app-valid-artifacts
