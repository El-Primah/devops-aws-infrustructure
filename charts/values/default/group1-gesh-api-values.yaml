
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/group1
  pullPolicy: Always
  tag: latest

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "group1-g_app-api"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  type: LoadBalancer
  annotations: {}
  port: 80
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30742

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    cpu: 200m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

command: []
args: []

env:
  - name: command
    value: prod
  - name: SERVICE_NAME
    value: quick-g_apptalt
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        name: env-config
        key: environment

probes:
  liveness: {}
  readiness: {}

volumeMounts:
  - name: logs
    mountPath: /var/logs/supervisor/

volumes:
  - name: logs
    hostPath:
      path: /LOGS/group1-g_app-api
      type: ""
