
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/consumer-expanded-logic 
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "consumer-expanded-logic "

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 98
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  port: 98
  ports:
    - name: http
      port: 98
      protocol: TCP
      targetPort: 98

ingress:
  enabled: false

resources:
  requests:
    cpu: 300m
    memory: 500M
  limits:
    cpu: "1"
    memory: 1024M

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - consumer-expanded-logic 
        topologyKey: kubernetes.io/hostname
      weight: 100

command:
  - /entrypoint.bash

args:
  - external_controller

env:
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        key: environment
        name: env-config

probes:
  liveness:
    exec:
      command:
        - liveness-check
    failureThreshold: 3
    initialDelaySeconds: 3
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 3
  readiness:
    exec:
      command:
        - readiness-check
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 3
    successThreshold: 1
    timeoutSeconds: 3

volumeMounts:
  - name: logs
    mountPath: /var/log

volumes:
  - name: logs
    hostPath:
      path: /LOGS/consumer-expanded-logic 
      type: ""

strategy:
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
  type: RollingUpdate
