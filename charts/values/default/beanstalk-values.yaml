
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/beanstalk
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "beanstalk"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 11300
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  port: 11300
  ports:
    - name: http
      port: 11300
      protocol: TCP
      targetPort: 11300

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 50Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

command: []
args: []
env: []
probes:
  liveness: {}
  readiness: {}
volumeMounts: []
volumes: []
