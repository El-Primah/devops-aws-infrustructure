
deployment:
  enabled: true
  
replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/group1
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "group1-sync-r-7"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podSecurityContext: {}

securityContext: {}

ports: []

service:
  enabled: false

ingress:
  enabled: false

resources:
  requests:
    cpu: "2"
    memory: 3G

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

strategy:
  type: Recreate

env:
  - name: command
    value: "prod"
  - name: NVIDIA_VISIBLE_DEVICES
    value: "all"
  - name: WORKER_REGION
    value: "7"
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        key: environment
        name: env-config

probes:
  liveness: {}
  readiness: {}

volumeMounts:
  - name: logs
    mountPath: /var/log

volumes:
  - name: logs
    hostPath:
      path: /LOGS/group1-sync-r-7
      type: ""
