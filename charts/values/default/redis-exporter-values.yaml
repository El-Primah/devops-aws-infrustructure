
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/redis-exporter
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "redis-exporter"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 9121
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  port: 9121
  ports:
    - name: http
      port: 9121
      protocol: TCP
      targetPort: 9121

ingress:
  enabled: false

resources:
  requests:
    cpu: "500m"
    memory: 600M
  limits:
    cpu: "1500m"
    memory: "1500M"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

strategy:
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
  type: RollingUpdate

args:
  - --redis.addr=redis.dfg.svc.cluster.local:6379

env:
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        key: environment
        name: env-config
