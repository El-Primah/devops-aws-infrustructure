
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/base-console
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "base-console"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  port: 80
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 80

ingress:
  enabled: true
  annotations: {}
  servicePort: 80
  ingressClassName: "nginx"
  useGlobalDomain: "internal"
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      subdomain: beanstalk
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 50Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: BEANSTALKD_HOST
    value: beanstalk.default
  - name: BEANSTALKD_PORT
    value: "11300"

probes:
  liveness: {}
  readiness: {}

volumeMounts: []
volumes: []
