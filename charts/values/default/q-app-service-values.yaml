
deployment:
  enabled: true

replicaCount: 1

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/q_ascore_service
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: regsecret

nameOverride: ""
fullnameOverride: "q-app-service"

serviceAccount:
  create: false
  annotations: {}
  name: "default"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ports:
  - name: http
    containerPort: 8000
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  port: 80
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8000

ingress:
  enabled: false

resources:
  requests:
    cpu: "500m"
    memory: 600M
  limits:
    cpu: "1500m"
    memory: "1500M"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

strategy:
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
  type: RollingUpdate

env:
  - name: COMMAND
    value: prod
  - name: ENVIRONMENT
    valueFrom:
      configMapKeyRef:
        key: environment
        name: env-config

probes:
  liveness:
    exec:
      command:
        - liveness-check
    failureThreshold: 3
    initialDelaySeconds: 3
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 3
  readiness:
    exec:
      command:
        - readiness-check
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 3
    successThreshold: 1
    timeoutSeconds: 3

volumeMounts:
  - name: logs
    mountPath: /var/log

volumes:
  - name: logs
    hostPath:
      path: /LOGS/q-app-svc
      type: ""
