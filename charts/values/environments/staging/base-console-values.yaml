service:
  type: NodePort
  ports:
  - name: http
    nodePort: 30654
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    nodePort: 30314
    port: 443
    protocol: TCP
    targetPort: 80

ingress:
  enabled: true
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      subdomain: beanstalk

image:
  repository: 343434343434.dkr.ecr.eu-west-1.amazonaws.com/comp/base-console
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: staging
