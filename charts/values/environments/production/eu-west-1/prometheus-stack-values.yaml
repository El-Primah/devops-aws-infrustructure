alertmanager:
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: https://hooks.slack.com/services/ASD123QWE/QWE123ASD/dFsrsdDFGJPOISDJMV
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_match:
        severity: critical
      target_match_re:
        severity: warning|info
    - equal:
      - namespace
      - alertname
      source_match:
        severity: warning
      target_match_re:
        severity: info
    receivers:
    - name: Default
    - name: Watchdog
    - name: Critical
    - name: 'slack-notifications'
      slack_configs:
        - channel: '#staging_alerts'
          send_resolved: true
    route:
      group_by:
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: slack-notifications
      repeat_interval: 12h
      routes:
      - match:
          alertname: Watchdog
        receiver: Watchdog
      - match:
          severity: critical
        receiver: slack-notifications
    templates:
    - '/etc/alertmanager/config/*.tmpl'

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.automation-dev.f_item.com
    paths:
    - /

    pathType: ImplementationSpecific

  alertmanagerSpec:
    externalUrl: https://alertmanager.automation-dev.f_item.com

grafana:
  adminPassword: monitor@auto
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.automation-dev.f_item.com
    pathType: ImplementationSpecific

  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes:
    - ReadWriteOnce
    size: 4Gi

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.automation-dev.f_item.com
    paths:
    - /

    pathType: ImplementationSpecific
  
  prometheusSpec:
    externalUrl: https://promethues.automation-dev.f_item.com

    ## Define which Nodes the Pods are scheduled on.
    ## ref: https://kubernetes.io/docs/user-guide/node-selection/

    storageSpec:
     volumeClaimTemplate:
       spec:
         storageClassName: gp3
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 20Gi