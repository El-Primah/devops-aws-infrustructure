{{- if .Values.storageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name | default (printf "%s-storageclass" (include "application.fullname" .)) }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  {{- with .Values.storageClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.storageClass.parameters }}
parameters:
  {{- toYaml . | nindent 2 }}
{{- end }}
provisioner: {{ .Values.storageClass.provisioner }}
{{- with .Values.storageClass.reclaimPolicy }}
reclaimPolicy: {{ . }}
{{- end }}
{{- with .Values.storageClass.volumeBindingMode }}
volumeBindingMode: {{ . }}
{{- end }}
{{- with .Values.storageClass.allowVolumeExpansion }}
allowVolumeExpansion: {{ . }}
{{- end }}
{{- with .Values.storageClass.mountOptions }}
mountOptions:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.storageClass.allowedTopologies }}
allowedTopologies:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
