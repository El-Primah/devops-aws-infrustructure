# Default values for the generic application chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deployment:
  enabled: false

replicaCount: 0

image:
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ports:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80

ingress:
  enabled: false
  servicePort: 80
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      subdomain: application
      domain: f_item.com
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Deployment parameters 
command: []
args: []
env: []
probes:
  liveness: {}
  readiness: {}
volumeMounts: []
volumes: []

priorityClassName: ""
priority: null

# Parameters for prerequsitions
configmap: {}
storageClass: {}

# Parameters for StatefulSet & PVC - group1-redis, comp-redis, mongodb, etc...
statefulset: {}
persistentVolumeClaim: {}

# Parameters for External Secrets Operator
SecretStore:
  enabled: false

ExternalSecrets:
  enabled: false