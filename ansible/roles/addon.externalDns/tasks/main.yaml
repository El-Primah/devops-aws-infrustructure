- name: Configure bitnami repository
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: Deploy external-dns for auto ingress record in route53
  kubernetes.core.helm:
    name: external-dns
    chart_ref: bitnami/external-dns
    release_namespace: ingress-controller
    create_namespace: true
    values_files:
      - "{{ helm_values_dir }}/{{ env_var }}/external_dns-values.yml"